<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMW90 Sensor Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        .header {
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #3498db;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #ecf0f1;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .datetime-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .date {
            font-size: 16px;
            color: #95a5a6;
            font-weight: 500;
        }

        .time {
            font-size: 24px;
            color: #3498db;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .content-area {
            padding: 30px;
            min-height: calc(100vh - 100px);
        }

        .content-placeholder {
            text-align: center;
            color: #7f8c8d;
            font-size: 18px;
            margin-top: 50px;
        }

        .chart-container {
            background: linear-gradient(145deg, #243447 0%, #1a252f 100%);
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .time-controls {
            display: flex;
            gap: 10px;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            font-size: 14px;
            color: #ecf0f1;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2c3e50;
            transition: 0.3s;
            border-radius: 24px;
            border: 2px solid #34495e;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 2px;
            background-color: #7f8c8d;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #27ae60;
            border-color: #229954;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.5);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #ecf0f1;
        }

        .toggle-switch.temp .toggle-label {
            color: #e74c3c;
        }

        .toggle-switch.humidity .toggle-label {
            color: #3498db;
        }

        .chart-btn {
            background-color: #34495e;
            color: #ecf0f1;
            border: 2px solid #2c3e50;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-btn:hover {
            background-color: #3498db;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .chart-btn.active {
            background-color: #3498db;
            border-color: #2980b9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-panel {
            background: linear-gradient(145deg, #243447 0%, #1a252f 100%);
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .stat-header {
            font-size: 20px;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin: 8px 0;
            background-color: #1c2833;
            border-left: 4px solid #7f8c8d;
            border-radius: 4px;
        }

        .stat-row.today {
            border-left-color: #e74c3c;
        }

        .stat-row.week52 {
            border-left-color: #f39c12;
        }

        .stat-label {
            font-size: 14px;
            color: #95a5a6;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-values {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-type {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .stat-value.high {
            color: #e74c3c;
        }

        .stat-value.low {
            color: #3498db;
        }

        .stat-unit {
            font-size: 14px;
            color: #95a5a6;
            margin-left: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">HMW90 Temperature and Humidity Data</div>
        <div class="datetime-display">
            <div class="date" id="date"></div>
            <div class="time" id="time"></div>
        </div>
    </div>
    
    <div class="content-area">
        <div class="chart-container">
            <div class="chart-controls">
                <div class="toggle-controls">
                    <div class="toggle-switch temp">
                        <span class="toggle-label">Temperature</span>
                        <label class="switch">
                            <input type="checkbox" id="tempToggle" checked onchange="toggleDataset(0)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-switch humidity">
                        <span class="toggle-label">Humidity</span>
                        <label class="switch">
                            <input type="checkbox" id="humidityToggle" checked onchange="toggleDataset(1)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="time-controls">
                    <button class="chart-btn active" onclick="changeTimeRange('1D')">1D</button>
                    <button class="chart-btn" onclick="changeTimeRange('1W')">1W</button>
                    <button class="chart-btn" onclick="changeTimeRange('1M')">1M</button>
                    <button class="chart-btn" onclick="changeTimeRange('3M')">3M</button>
                    <button class="chart-btn" onclick="changeTimeRange('1Y')">1Y</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="sensorChart"></canvas>
            </div>
        </div>

        <div class="stats-container">
            <!-- Temperature Statistics -->
            <div class="stat-panel">
                <div class="stat-header">Temperature</div>
                
                <div class="stat-row today">
                    <div class="stat-label">Today's Range</div>
                    <div class="stat-values">
                        <div class="stat-item">
                            <div class="stat-type">High</div>
                            <div class="stat-value high">
                                <span id="temp-today-high">28.5</span><span class="stat-unit">°C</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-type">Low</div>
                            <div class="stat-value low">
                                <span id="temp-today-low">18.2</span><span class="stat-unit">°C</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="stat-row week52">
                    <div class="stat-label">52-Week Range</div>
                    <div class="stat-values">
                        <div class="stat-item">
                            <div class="stat-type">High</div>
                            <div class="stat-value high">
                                <span id="temp-52w-high">42.8</span><span class="stat-unit">°C</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-type">Low</div>
                            <div class="stat-value low">
                                <span id="temp-52w-low">-5.3</span><span class="stat-unit">°C</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Humidity Statistics -->
            <div class="stat-panel">
                <div class="stat-header">Humidity</div>
                
                <div class="stat-row today">
                    <div class="stat-label">Today's Range</div>
                    <div class="stat-values">
                        <div class="stat-item">
                            <div class="stat-type">High</div>
                            <div class="stat-value high">
                                <span id="humid-today-high">68</span><span class="stat-unit">%</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-type">Low</div>
                            <div class="stat-value low">
                                <span id="humid-today-low">42</span><span class="stat-unit">%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="stat-row week52">
                    <div class="stat-label">52-Week Range</div>
                    <div class="stat-values">
                        <div class="stat-item">
                            <div class="stat-type">High</div>
                            <div class="stat-value high">
                                <span id="humid-52w-high">95</span><span class="stat-unit">%</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-type">Low</div>
                            <div class="stat-value low">
                                <span id="humid-52w-low">15</span><span class="stat-unit">%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sensorChart;
        let currentRange = '1D';

        // Generate sample data
        function generateData(range) {
            const now = new Date();
            const data = [];
            let points, interval;

            switch(range) {
                case '1D':
                    points = 24;
                    interval = 60 * 60 * 1000; // 1 hour
                    break;
                case '1W':
                    points = 168;
                    interval = 60 * 60 * 1000; // 1 hour
                    break;
                case '1M':
                    points = 30;
                    interval = 24 * 60 * 60 * 1000; // 1 day
                    break;
                case '3M':
                    points = 90;
                    interval = 24 * 60 * 60 * 1000; // 1 day
                    break;
                case '1Y':
                    points = 365;
                    interval = 24 * 60 * 60 * 1000; // 1 day
                    break;
            }

            for (let i = points; i >= 0; i--) {
                const timestamp = new Date(now - (i * interval));
                const temp = 20 + Math.sin(i / 10) * 8 + Math.random() * 4;
                const humidity = 50 + Math.cos(i / 8) * 20 + Math.random() * 10;
                
                data.push({
                    timestamp: timestamp,
                    temperature: parseFloat(temp.toFixed(1)),
                    humidity: parseFloat(humidity.toFixed(1))
                });
            }

            return data;
        }

        function initChart() {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            const data = generateData(currentRange);

            sensorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.timestamp),
                    datasets: [
                        {
                            label: 'Temperature (°C)',
                            data: data.map(d => d.temperature),
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: '#e74c3c',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Humidity (%)',
                            data: data.map(d => d.humidity),
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: '#3498db',
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#ecf0f1',
                                font: {
                                    size: 14,
                                    weight: '500'
                                },
                                padding: 15,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(26, 37, 47, 0.95)',
                            titleColor: '#ecf0f1',
                            bodyColor: '#ecf0f1',
                            borderColor: '#3498db',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleString('en-US', {
                                        month: 'short',
                                        day: 'numeric',
                                        hour: '2-digit',
                                        minute: '2-digit'
                                    });
                                },
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    label += context.parsed.y.toFixed(1);
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                tooltipFormat: 'MMM dd, HH:mm',
                                displayFormats: {
                                    hour: 'HH:mm',
                                    day: 'MMM dd',
                                    month: 'MMM yyyy'
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#95a5a6',
                                font: {
                                    size: 11
                                }
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature (°C)',
                                color: '#e74c3c',
                                font: {
                                    size: 12,
                                    weight: '600'
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#e74c3c',
                                font: {
                                    size: 11
                                }
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Humidity (%)',
                                color: '#3498db',
                                font: {
                                    size: 12,
                                    weight: '600'
                                }
                            },
                            grid: {
                                drawOnChartArea: false,
                                drawBorder: false
                            },
                            ticks: {
                                color: '#3498db',
                                font: {
                                    size: 11
                                }
                            }
                        }
                    }
                }
            });

            updateStats(data);
        }

        function updateStats(data) {
            const temps = data.map(d => d.temperature);
            const humids = data.map(d => d.humidity);

            document.getElementById('temp-today-high').textContent = Math.max(...temps).toFixed(1);
            document.getElementById('temp-today-low').textContent = Math.min(...temps).toFixed(1);
            document.getElementById('humid-today-high').textContent = Math.max(...humids).toFixed(0);
            document.getElementById('humid-today-low').textContent = Math.min(...humids).toFixed(0);
        }

        function changeTimeRange(range) {
            currentRange = range;
            
            // Update button states
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update chart data
            const data = generateData(range);
            sensorChart.data.labels = data.map(d => d.timestamp);
            sensorChart.data.datasets[0].data = data.map(d => d.temperature);
            sensorChart.data.datasets[1].data = data.map(d => d.humidity);
            sensorChart.update();

            updateStats(data);
        }

        function toggleDataset(index) {
            const meta = sensorChart.getDatasetMeta(index);
            meta.hidden = !meta.hidden;
            sensorChart.update();
        }

        function updateDateTime() {
            const now = new Date();
            
            const dateOptions = { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            };
            const dateStr = now.toLocaleDateString('en-US', dateOptions);
            
            const timeStr = now.toLocaleTimeString('en-US', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            document.getElementById('date').textContent = dateStr;
            document.getElementById('time').textContent = timeStr;
        }

        // Initialize
        updateDateTime();
        setInterval(updateDateTime, 1000);
        
        // Wait for Chart.js to load, then initialize chart
        window.addEventListener('load', function() {
            initChart();
        });
    </script>
</body>
</html>
